services:
  db:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: always
    env_file:
      - .env
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Technical-Challenge.WebAPI/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    restart: on-failure

  worker:
    build:
      context: .
      dockerfile: Technical-Challenge.Application/Dockerfile
    command: ["dotnet", "Technical-Challenge.WebAPI.dll", "--worker"]
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    restart: on-failure

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: always
    env_file:
      - .env
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  postgres_data:
