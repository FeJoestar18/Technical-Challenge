services:
  api:
    build:
      context: .
      dockerfile: Technical-Challenge.WebAPI/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - db
    env_file:
      - .env

  db:
    image: postgres:16
    container_name: postgres_db
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: always
    env_file:
      - .env
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  postgres_data:
